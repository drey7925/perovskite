name: Rust

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - uses: actions/checkout@v3
    - name: Build
      run: |
        sudo apt-get update
        sudo apt-get install protobuf-compiler libasound-dev libdbus-1-dev pkg-config
        sudo apt install libshaderc-dev libstdc++-11-dev
        rustup install 1.99
        # cargo +1.99 build --verbose --release
        RUST_BACKTRACE=1 CARGO_TERM_COLOR=never cargo +1.99 build --release -vv --locked || true
        # df -h .
        # set -x
        # ls -l target/release/deps/libvulkano_shaders-*.so
        # file target/release/deps/libvulkano_shaders-*.so
        # ldd target/release/deps/libvulkano_shaders-*.so
        # readelf -S target/release/deps/libvulkano_shaders-*.so | grep -E '\.rustc|\.dynsym'
        # nm -D target/release/deps/libvulkano_shaders-*.so | grep -i proc_macro
        # strings target/release/deps/libvulkano_shaders-*.so | grep -m1 'rustc version'
        # rustc -vV
        # CARGO=/home/runner/.rustup/toolchains/1.88-x86_64-unknown-linux-gnu/bin/cargo CARGO_CRATE_NAME=egui_winit_vulkano CARGO_MANIFEST_DIR=/home/runner/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/egui_winit_vulkano-0.28.0 CARGO_MANIFEST_PATH=/home/runner/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/egui_winit_vulkano-0.28.0/Cargo.toml CARGO_PKG_AUTHORS='hakolao <okkohakola@gmail.com>' CARGO_PKG_DESCRIPTION='Egui immediate mode gui integration with winit and Vulkano' CARGO_PKG_HOMEPAGE='https://github.com/hakolao/egui_winit_vulkano' CARGO_PKG_LICENSE=Apache-2.0 CARGO_PKG_LICENSE_FILE='' CARGO_PKG_NAME=egui_winit_vulkano CARGO_PKG_README=README.md CARGO_PKG_REPOSITORY='https://github.com/hakolao/egui_winit_vulkano' CARGO_PKG_RUST_VERSION='' CARGO_PKG_VERSION=0.28.0 CARGO_PKG_VERSION_MAJOR=0 CARGO_PKG_VERSION_MINOR=28 CARGO_PKG_VERSION_PATCH=0 CARGO_PKG_VERSION_PRE='' LD_LIBRARY_PATH='/home/runner/work/perovskite/perovskite/target/release/deps:/home/runner/.rustup/toolchains/1.88-x86_64-unknown-linux-gnu/lib' strace -f -e trace=openat,stat,newfstatat,access -o /tmp/rustc.strace /home/runner/.rustup/toolchains/1.88-x86_64-unknown-linux-gnu/bin/rustc --crate-name egui_winit_vulkano --edition=2021 /home/runner/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/egui_winit_vulkano-0.28.0/src/lib.rs --error-format=json --json=diagnostic-rendered-ansi,artifacts,future-incompat --crate-type lib --emit=dep-info,metadata,link -C opt-level=3 -C embed-bitcode=no -C debuginfo=1 --cfg 'feature="clipboard"' --cfg 'feature="default"' --cfg 'feature="image"' --cfg 'feature="links"' --cfg 'feature="wayland"' --cfg 'feature="x11"' --check-cfg 'cfg(docsrs,test)' --check-cfg 'cfg(feature, values("clipboard", "default", "image", "links", "wayland", "x11"))' -C metadata=64ac9cfcc62d541a -C extra-filename=-d7c6f72b09986a3d --out-dir /home/runner/work/perovskite/perovskite/target/release/deps -L dependency=/home/runner/work/perovskite/perovskite/target/release/deps --extern ahash=/home/runner/work/perovskite/perovskite/target/release/deps/libahash-4450667eefc7cd05.rmeta --extern egui=/home/runner/work/perovskite/perovskite/target/release/deps/libegui-c9cab5fb2c4c460f.rmeta --extern egui_winit=/home/runner/work/perovskite/perovskite/target/release/deps/libegui_winit-8289dd1bb5210513.rmeta --extern image=/home/runner/work/perovskite/perovskite/target/release/deps/libimage-5300c792025912e5.rmeta --extern vulkano=/home/runner/work/perovskite/perovskite/target/release/deps/libvulkano-bb139db3efbaa379.rmeta --extern vulkano_shaders=/home/runner/work/perovskite/perovskite/target/release/deps/libvulkano_shaders-bef08efecbe84016.so --extern winit=/home/runner/work/perovskite/perovskite/target/release/deps/libwinit-40988235aac1b7b2.rmeta --cap-lints warn
        # grep -n vulkano_shaders /tmp/rustc.strace
      # Unfortunately we need --release for loom tests to finish in a reasonable time
    - name: Test core
      run: cargo +1.99 test --verbose -p perovskite_core --release
    - name: Test game content
      run: cargo +1.99 test --verbose -p perovskite_game_api --release
    - name: Test server
      run: cargo +1.99 test --verbose -p perovskite_server --release
    - name: Test client
      run: cargo +1.99 test --verbose -p perovskite_client --release
